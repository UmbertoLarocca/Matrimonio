<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Nostro Matrimonio - 2026</title>

    <style>
        /* --- STILE GENERALE --- */
        body {
            font-family: 'Playfair Display', serif; /* Un font più elegante per matrimoni */
            background-color: #f9f4f1;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 90%;
            margin: 50px 0;
            background: white;
            border-radius: 20px;
            overflow: hidden; /* Serve per non far uscire la foto dai bordi arrotondati */
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            animation: entrata 1.2s ease-out;
        }

        /* --- IMMAGINE DI COPERTINA --- */
        .header-img {
            width: 100%;
            height: 300px;
            background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80'); /* Foto d'esempio */
            background-size: cover;
            background-position: center;
        }

        .content {
            padding: 40px;
            text-align: center;
        }

        h1 { color: #8d6e63; font-size: 2.5rem; margin-bottom: 10px; }
        .data { font-style: italic; color: #bc8a5f; font-size: 1.2rem; }

        /* --- LA MAPPA --- */
        .map-container {
            margin: 30px 0;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        /* --- BOTTONE --- */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: #d4a373;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #bc8a5f;
            transform: scale(1.05);
        }

        @keyframes entrata {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-img"></div>

        <div class="content">
            <h1>Umberto & Laura</h1>
            <p class="data">12 Settembre 2026</p>
            <p>Siamo felici di condividere con voi il nostro giorno più bello.</p>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">

            <h3>La Cerimonia</h3>
            <p>Villa Schiuma, Contrada Rondinelle, 75100, Matera</p>

            <div class="map-container">
                <iframe 
             src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1069.5143207087644!2d16.58854325139418!3d40.695043678611675!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x13477f768e683fdb%3A0x50b48fd341334fbb!2sVilla%20Schiuma%20-%20Sala%20Ricevimenti%20Matera!5e0!3m2!1sit!2sit!4v1774340387137!5m2!1sit!2sit" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </iframe>
            </div>

            <a href="https://docs.google.com/forms/d/e/1FAIpQLSec7a2I11KEOR8PrhPiIlcKhMvWKGtRciARoVSjwmwZUGYiyw/viewform?usp=header" target="_blank" class="btn">Conferma Presenza</a>
        </div>
    </div>

</body>
</html>
